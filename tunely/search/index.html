<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tune.ly - Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-900 text-white flex justify-center">
  <div class="w-full max-w-md min-h-screen relative pb-16 p-4">
    <div class="sticky top-0 bg-gray-900 pt-2 pb-4 z-10">
      <input type="text" id="searchInput" placeholder="Search sounds, creators..." class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-xl text-white text-sm focus:outline-none focus:border-[#FF0050]">
    </div>

    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Trending Sounds</h2>
    <div id="audioList" class="space-y-2">
      <p class="text-xs text-gray-500">Loading sounds...</p>
    </div>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-gray-800 flex justify-around items-center h-14 z-50 max-w-md mx-auto">
      <a href="../" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Feed</a>
      <a href="./" class="flex flex-col items-center text-[#FF0050] text-[10px] font-medium">Search</a>
      <a href="../upload/" class="flex flex-col items-center"><div class="bg-[#FF0050] p-2 rounded-full text-white">+</div></a>
      <a href="../inbox/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Inbox</a>
      <a href="../profile/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Profile</a>
    </nav>
  </div>

  <script type="module">
    import { supabase } from '../js/supabase-config.js';

    async function loadAudios() {
      const { data: audios } = await supabase.from('audios').select('*').limit(15);
      const audioList = document.getElementById('audioList');

      if (!audios || audios.length === 0) {
        audioList.innerHTML = `<p class="text-xs text-gray-500">No sounds available yet.</p>`;
        return;
      }

      audioList.innerHTML = audios.map(audio => `
        <div class="flex items-center justify-between bg-gray-800/60 p-3 rounded-xl border border-gray-800">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-[#FF0050] rounded-full flex items-center justify-center text-xs font-bold">🎵</div>
            <div>
              <p class="font-semibold text-xs">${audio.title}</p>
              <p class="text-[10px] text-gray-400">${audio.artist}</p>
            </div>
          </div>
          <button class="px-3 py-1 bg-[#FF0050] text-[10px] font-bold rounded-full hover:bg-pink-600 transition">Use Sound</button>
        </div>
      `).join('');
    }

    loadAudios();
  </script>
</body>
</html>
