<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tune.ly - Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-900 text-white flex justify-center">
  <div class="w-full max-w-md min-h-screen relative p-4 pb-16">
    <div class="flex flex-col items-center pt-2">
      <div class="relative">
        <img id="avatar" class="w-20 h-20 rounded-full border-2 border-white object-cover shadow-lg" src="https://via.placeholder.com/150">
        <span id="crownBadge" class="hidden absolute -top-2 right-0 text-xl drop-shadow">👑</span>
      </div>
      <h2 id="username" class="font-bold mt-2 text-base">@username</h2>
      <p id="bio" class="text-xs text-gray-400 mt-0.5">Creating on Tune.ly 🎵</p>

      <div class="flex gap-2 mt-4">
        <button id="openEditModalBtn" class="px-5 py-1.5 bg-[#FF0050] font-semibold text-xs rounded-full hover:bg-pink-600 transition">Edit Profile</button>
        <button id="logoutBtn" class="px-5 py-1.5 border border-gray-700 text-xs rounded-full hover:bg-gray-800 transition">Sign Out</button>
      </div>
    </div>

    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mt-8 mb-3">My Tunes</h3>
    <div id="userGrid" class="grid grid-cols-3 gap-1">
      <p class="text-xs text-gray-500 col-span-3">Loading videos...</p>
    </div>

    <!-- Edit Profile Modal Overlay -->
    <div id="editModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
      <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
        <h3 class="font-bold text-sm text-center">Edit Profile</h3>
        
        <form id="editProfileForm" class="space-y-3">
          <div>
            <label class="block text-[10px] font-semibold text-gray-400 uppercase mb-1">Username</label>
            <input type="text" id="editUsername" required class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#FF0050]">
          </div>

          <div>
            <label class="block text-[10px] font-semibold text-gray-400 uppercase mb-1">Bio</label>
            <textarea id="editBio" rows="2" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#FF0050] resize-none"></textarea>
          </div>

          <div>
            <label class="block text-[10px] font-semibold text-gray-400 uppercase mb-1">Profile Picture</label>
            <input type="file" id="editAvatarFile" accept="image/*" class="w-full text-xs text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gray-800 file:text-white hover:file:bg-gray-700 cursor-pointer">
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" id="closeEditModalBtn" class="w-1/2 py-2 border border-gray-700 text-xs rounded-xl hover:bg-gray-800 transition">Cancel</button>
            <button type="submit" id="saveProfileBtn" class="w-1/2 py-2 bg-[#FF0050] font-bold text-xs rounded-xl hover:bg-pink-600 transition">Save</button>
          </div>
        </form>
        <p id="editStatus" class="text-[10px] text-center text-gray-400 min-h-[12px]"></p>
      </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-gray-800 flex justify-around items-center h-14 z-50 max-w-md mx-auto">
      <a href="../" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Feed</a>
      <a href="../search/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Search</a>
      <a href="../upload/" class="flex flex-col items-center"><div class="bg-[#FF0050] p-2 rounded-full text-white">+</div></a>
      <a href="../inbox/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Inbox</a>
      <a href="./" class="flex flex-col items-center text-[#FF0050] text-[10px] font-medium">Profile</a>
    </nav>
  </div>

  <script type="module">
    import { supabase } from '../js/supabase-config.js';
    import { requireAuth } from '../js/auth-check.js';

    let currentUser = null;
    let currentAvatarUrl = '';

    async function loadProfile() {
      currentUser = await requireAuth();
      if (!currentUser) return;

      const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
      
      if (profile) {
        document.getElementById('username').textContent = `@${profile.username || currentUser.email.split('@')[0]}`;
        document.getElementById('bio').textContent = profile.bio || 'Creating on Tune.ly 🎵';
        
        currentAvatarUrl = profile.avatar_url || '';
        if (currentAvatarUrl) {
          document.getElementById('avatar').src = currentAvatarUrl;
        }

        if (profile.is_crowned) document.getElementById('crownBadge').classList.remove('hidden');

        // Pre-fill edit modal form
        document.getElementById('editUsername').value = profile.username || '';
        document.getElementById('editBio').value = profile.bio || '';
      }

      const { data: posts } = await supabase.from('posts').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
      const userGrid = document.getElementById('userGrid');

      if (!posts || posts.length === 0) {
        userGrid.innerHTML = `<p class="text-xs text-gray-500 col-span-3">You haven't posted any tunes yet.</p>`;
        return;
      }

      userGrid.innerHTML = posts.map(post => `
        <div class="aspect-[3/4] bg-black rounded overflow-hidden">
          <video class="w-full h-full object-cover" src="${post.video_url}"></video>
        </div>
      `).join('');
    }

    // Modal display triggers
    const editModal = document.getElementById('editModal');
    document.getElementById('openEditModalBtn').addEventListener('click', () => editModal.classList.remove('hidden'));
    document.getElementById('closeEditModalBtn').addEventListener('click', () => editModal.classList.add('hidden'));

    // Handle updating profile data & uploading avatar
    document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('editStatus');
      status.textContent = 'Saving changes...';

      const updatedUsername = document.getElementById('editUsername').value.trim();
      const updatedBio = document.getElementById('editBio').value.trim();
      const avatarFile = document.getElementById('editAvatarFile').files[0];

      let uploadedAvatarUrl = currentAvatarUrl;

      // Upload file to Supabase storage if selected
      if (avatarFile) {
        const fileExt = avatarFile.name.split('.').pop();
        const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;
        const filePath = `avatars/${fileName}`;

        const { error: uploadError } = await supabase.storage
          .from('avatars')
          .upload(filePath, avatarFile, { upsert: true });

        if (uploadError) {
          status.textContent = `Image upload failed: ${uploadError.message}`;
          return;
        }

        const { data: publicUrlData } = supabase.storage
          .from('avatars')
          .getPublicUrl(filePath);

        uploadedAvatarUrl = publicUrlData.publicUrl;
      }

      // Update Database Record
      const { error } = await supabase.from('profiles').update({
        username: updatedUsername,
        bio: updatedBio,
        avatar_url: uploadedAvatarUrl
      }).eq('id', currentUser.id);

      if (error) {
        status.textContent = error.message;
      } else {
        editModal.classList.add('hidden');
        status.textContent = '';
        document.getElementById('editAvatarFile').value = '';
        loadProfile();
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '../login/';
    });

    loadProfile();
  </script>
</body>
</html>
