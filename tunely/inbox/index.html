<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tune.ly - Inbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-900 text-white flex justify-center">
  <div class="w-full max-w-md min-h-screen relative p-4 pb-16">
    <h1 class="text-base font-bold mb-4 border-b border-gray-800 pb-3 text-center">Notifications</h1>

    <div id="notificationsContainer" class="space-y-3">
      <p class="text-xs text-gray-500 text-center py-8">Loading notifications...</p>
    </div>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-gray-800 flex justify-around items-center h-14 z-50 max-w-md mx-auto">
      <a href="../" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Feed</a>
      <a href="../search/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Search</a>
      <a href="../upload/" class="flex flex-col items-center"><div class="bg-[#FF0050] p-2 rounded-full text-white">+</div></a>
      <a href="./" class="flex flex-col items-center text-[#FF0050] text-[10px] font-medium">Inbox</a>
      <a href="../profile/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Profile</a>
    </nav>
  </div>

  <script type="module">
    import { supabase } from '../js/supabase-config.js';
    import { requireAuth } from '../js/auth-check.js';

    function formatTimeAgo(dateString) {
      const date = new Date(dateString);
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return `${days}d ago`;
    }

    async function loadNotifications() {
      const user = await requireAuth();
      if (!user) return;

      const container = document.getElementById('notificationsContainer');

      // Fetch dynamic notifications with the actor profile details
      const { data: notifications, error } = await supabase
        .from('notifications')
        .select(`
          id, type, message, created_at,
          actor:actor_id ( username, avatar_url )
        `)
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Notification fetch error:', error);
        container.innerHTML = `<p class="text-xs text-red-500 text-center py-8">Error loading notifications.</p>`;
        return;
      }

      if (!notifications || notifications.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 text-center py-8">No notifications yet.</p>`;
        return;
      }

      container.innerHTML = notifications.map(item => {
        const isLike = item.type === 'like';
        const isFeature = item.type === 'feature';
        const icon = isLike ? '❤️' : isFeature ? '👑' : '🔔';
        const iconBg = isLike ? 'bg-pink-500/20 text-[#FF0050]' : isFeature ? 'bg-yellow-500/20 text-yellow-400' : 'bg-gray-700/50 text-white';
        
        const actorName = item.actor?.username ? item.actor.username : 'Tune.ly Team';

        return `
          <div class="flex items-center gap-3 bg-gray-800/40 p-3 rounded-xl border border-gray-800/80">
            <div class="w-9 h-9 ${iconBg} rounded-full flex items-center justify-center text-sm font-bold flex-shrink-0">
              ${icon}
            </div>
            <div class="text-xs min-w-0 flex-1">
              <p><span class="font-bold">${actorName}</span> ${item.message}</p>
              <p class="text-[10px] text-gray-500 mt-0.5">${formatTimeAgo(item.created_at)}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    loadNotifications();
  </script>
</body>
</html>
