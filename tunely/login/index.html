<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tune.ly - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-[#121212] p-4">
  <div class="w-full max-w-sm bg-gray-900 p-6 rounded-2xl border border-gray-800 text-center shadow-2xl">
    <h1 class="text-4xl font-black text-[#FF0050] tracking-wider mb-1">tune.ly</h1>
    <p class="text-xs text-gray-400 mb-6">Create & share 15s lip-sync videos</p>

    <form id="authForm" class="space-y-3">
      <input type="text" id="username" placeholder="Username (for Sign Up)" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white text-sm focus:outline-none focus:border-[#FF0050]">
      <input type="email" id="email" placeholder="Email address" required class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white text-sm focus:outline-none focus:border-[#FF0050]">
      <input type="password" id="password" placeholder="Password" required class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white text-sm focus:outline-none focus:border-[#FF0050]">
      
      <button type="submit" id="submitBtn" class="w-full py-3 bg-[#FF0050] hover:bg-pink-600 font-bold text-sm rounded-xl transition duration-200 shadow-lg">Log In / Sign Up</button>
    </form>

    <p id="statusMsg" class="mt-4 text-xs text-gray-400 min-h-[16px]"></p>
  </div>

  <script type="module">
    import { supabase } from '../js/supabase-config.js';
    import { redirectIfAuth } from '../js/auth-check.js';

    redirectIfAuth();

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value.trim();
      const statusMsg = document.getElementById('statusMsg');

      statusMsg.textContent = "Connecting...";

      let { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error && error.message.includes('Invalid login credentials')) {
        statusMsg.textContent = "Creating account...";
        const signup = await supabase.auth.signUp({ email, password });
        error = signup.error;
        data = signup.data;

        if (!error && data?.user) {
          await supabase.from('profiles').insert({
            id: data.user.id,
            username: username || email.split('@')[0],
            display_name: username || email.split('@')[0]
          });
        }
      }

      if (error) {
        statusMsg.textContent = error.message;
      } else {
        window.location.href = '../';
      }
    });
  </script>
</body>
</html>
