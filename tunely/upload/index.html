<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tune.ly - Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-900 text-white flex justify-center">
  <div class="w-full max-w-md min-h-screen relative p-4 pb-16">
    <h1 class="text-lg font-bold mb-6 text-center tracking-wide">Post a Tune</h1>

    <form id="uploadForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Select Video File (.mp4)</label>
        <input type="file" id="videoFile" accept="video/*" required class="w-full text-xs text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:bg-[#FF0050] file:text-white file:font-semibold cursor-pointer">
      </div>

      <!-- Thumbnail Preview & Custom Upload -->
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Thumbnail Cover</label>
        <div class="flex items-center gap-3 bg-gray-800 p-3 rounded-xl border border-gray-700">
          <div class="w-16 h-20 bg-gray-900 rounded-lg overflow-hidden flex items-center justify-center border border-gray-700 relative">
            <img id="thumbPreview" class="w-full h-full object-cover hidden" alt="Thumbnail preview">
            <span id="thumbPlaceholder" class="text-[10px] text-gray-500 text-center px-1">Auto-generated</span>
          </div>
          <div class="flex-1 space-y-2">
            <p class="text-[11px] text-gray-400">An automatic frame will be captured, or you can pick a custom image.</p>
            <input type="file" id="customThumb" accept="image/*" class="w-full text-[10px] text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-gray-700 file:text-white cursor-pointer">
          </div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Caption</label>
        <textarea id="caption" placeholder="Write a caption... #lipsync #tunely" class="w-full p-3 bg-gray-800 border border-gray-700 rounded-xl text-white text-xs focus:outline-none focus:border-[#FF0050] h-24 resize-none"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="w-full py-3 bg-[#FF0050] font-bold text-xs rounded-xl shadow-lg hover:bg-pink-600 transition">Publish Video</button>
    </form>
    
    <p id="status" class="mt-4 text-xs text-center text-gray-400 min-h-[16px]"></p>

    <!-- Hidden Video & Canvas elements for auto thumbnail extraction -->
    <video id="hiddenVideo" class="hidden" preload="metadata" muted playsinline></video>
    <canvas id="hiddenCanvas" class="hidden"></canvas>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-gray-800 flex justify-around items-center h-14 z-50 max-w-md mx-auto">
      <a href="../" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Feed</a>
      <a href="../search/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Search</a>
      <a href="./" class="flex flex-col items-center"><div class="bg-[#FF0050] p-2 rounded-full text-white">+</div></a>
      <a href="../inbox/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Inbox</a>
      <a href="../profile/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">Profile</a>
    </nav>
  </div>

  <script type="module">
    import { supabase } from '../js/supabase-config.js';
    import { requireAuth } from '../js/auth-check.js';

    let user;
    let autoCapturedBlob = null;

    requireAuth().then(u => user = u);

    const videoInput = document.getElementById('videoFile');
    const customThumbInput = document.getElementById('customThumb');
    const thumbPreview = document.getElementById('thumbPreview');
    const thumbPlaceholder = document.getElementById('thumbPlaceholder');
    const hiddenVideo = document.getElementById('hiddenVideo');
    const hiddenCanvas = document.getElementById('hiddenCanvas');

    // Auto-generate thumbnail when a video is selected
    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      hiddenVideo.src = url;
      hiddenVideo.currentTime = 1; // Seek 1s in for thumbnail frame
    });

    hiddenVideo.addEventListener('seeked', () => {
      hiddenCanvas.width = hiddenVideo.videoWidth || 360;
      hiddenCanvas.height = hiddenVideo.videoHeight || 640;
      const ctx = hiddenCanvas.getContext('2d');
      ctx.drawImage(hiddenVideo, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

      hiddenCanvas.toBlob((blob) => {
        autoCapturedBlob = blob;
        if (!customThumbInput.files[0]) {
          thumbPreview.src = URL.createObjectURL(blob);
          thumbPreview.classList.remove('hidden');
          thumbPlaceholder.classList.add('hidden');
        }
      }, 'image/jpeg', 0.8);
    });

    // Handle custom image selection
    customThumbInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        thumbPreview.src = URL.createObjectURL(file);
        thumbPreview.classList.remove('hidden');
        thumbPlaceholder.classList.add('hidden');
      }
    });

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      const videoFile = videoInput.files[0];
      const caption = document.getElementById('caption').value;

      if (!user || !videoFile) return;

      submitBtn.disabled = true;
      status.textContent = "Uploading video file to storage...";

      // 1. Upload Video
      const timestamp = Date.now();
      const videoPath = `${user.id}/${timestamp}.mp4`;
      const { error: videoErr } = await supabase.storage.from('videos').upload(videoPath, videoFile);

      if (videoErr) {
        status.textContent = videoErr.message;
        submitBtn.disabled = false;
        return;
      }

      const { data: { publicUrl: videoUrl } } = supabase.storage.from('videos').getPublicUrl(videoPath);

      // 2. Upload Thumbnail
      status.textContent = "Uploading thumbnail...";
      let thumbnailUrl = null;
      const thumbFile = customThumbInput.files[0] || autoCapturedBlob;

      if (thumbFile) {
        const thumbPath = `${user.id}/${timestamp}.jpg`;
        const { error: thumbErr } = await supabase.storage.from('thumbnails').upload(thumbPath, thumbFile, {
          contentType: 'image/jpeg'
        });

        if (!thumbErr) {
          const { data: { publicUrl } } = supabase.storage.from('thumbnails').getPublicUrl(thumbPath);
          thumbnailUrl = publicUrl;
        }
      }

      // 3. Insert Database Record
      status.textContent = "Creating post record...";
      const { error: dbError } = await supabase.from('posts').insert({
        user_id: user.id,
        video_url: videoUrl,
        thumbnail_url: thumbnailUrl,
        caption: caption
      });

      if (dbError) {
        status.textContent = dbError.message;
        submitBtn.disabled = false;
      } else {
        window.location.href = '../';
      }
    });
  </script>
</body>
</html>
