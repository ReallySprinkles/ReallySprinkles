<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tune.ly - Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-white flex justify-center">
  <div class="w-full max-w-md h-screen relative overflow-hidden bg-gray-900 pb-14">
    
    <!-- Header Overlay -->
    <header class="absolute top-0 left-0 right-0 flex justify-center gap-6 py-4 z-20 bg-gradient-to-b from-black/80 to-transparent text-sm font-semibold tracking-wide">
      <button class="text-gray-400 hover:text-white">Following</button>
      <button class="text-white border-b-2 border-[#FF0050] pb-0.5">For You</button>
    </header>

    <!-- Scrollable Feed -->
    <div id="feedContainer" class="h-full overflow-y-scroll snap-y snap-mandatory no-scrollbar">
      <div class="flex h-full items-center justify-center text-gray-500 text-sm">Loading Tunes...</div>
    </div>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-gray-800 flex justify-around items-center h-14 z-50 max-w-md mx-auto">
      <a href="./" class="flex flex-col items-center text-[#FF0050] text-[10px] font-medium">
        <svg class="w-5 h-5 mb-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Feed
      </a>
      <a href="search/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">
        <svg class="w-5 h-5 mb-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> Search
      </a>
      <a href="upload/" class="flex flex-col items-center">
        <div class="bg-[#FF0050] p-2 rounded-full text-white shadow-lg active:scale-95 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        </div>
      </a>
      <a href="inbox/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">
        <svg class="w-5 h-5 mb-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg> Inbox
      </a>
      <a href="profile/" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] font-medium">
        <svg class="w-5 h-5 mb-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> Profile
      </a>
    </nav>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-config.js';

    async function fetchFeed() {
      // Added !left joins to prevent filtering out posts without linked audio or profiles
      const { data: posts, error } = await supabase
        .from('posts')
        .select(`
          id, video_url, caption, likes_count,
          profiles!left ( username, is_crowned, avatar_url ),
          audios!left ( title, artist )
        `)
        .order('created_at', { ascending: false });

      const feedContainer = document.getElementById('feedContainer');

      if (error || !posts || posts.length === 0) {
        console.error('Fetch feed error:', error);
        feedContainer.innerHTML = `<div class="flex h-full items-center justify-center text-gray-500 text-sm">No videos found. Be the first to upload!</div>`;
        return;
      }

      feedContainer.innerHTML = posts.map(post => `
        <div class="snap-start relative h-full w-full flex items-center justify-center bg-black">
          <video class="h-full w-full object-cover cursor-pointer" src="${post.video_url}" loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
          
          <!-- Right Controls Overlay -->
          <div class="absolute right-3 bottom-20 flex flex-col items-center gap-5 z-10">
            <div class="relative">
              <img class="w-11 h-11 rounded-full border-2 border-white object-cover shadow" src="${post.profiles?.avatar_url || 'https://via.placeholder.com/150'}">
              ${post.profiles?.is_crowned ? '<span class="absolute -top-2 left-2.5 text-xs drop-shadow">👑</span>' : ''}
            </div>
            
            <button class="flex flex-col items-center group">
              <div class="w-10 h-10 rounded-full bg-black/40 flex items-center justify-center text-xl">❤️</div>
              <span class="text-[10px] font-semibold mt-0.5">${post.likes_count || 0}</span>
            </button>

            <!-- Rotating Vinyl Disc -->
            <div class="w-9 h-9 rounded-full border-2 border-gray-700 bg-black animate-spin-slow overflow-hidden shadow-lg flex items-center justify-center">
              <div class="w-3 h-3 bg-[#FF0050] rounded-full"></div>
            </div>
          </div>

          <!-- Bottom Text Overlay -->
          <div class="absolute bottom-4 left-3 right-16 z-10 space-y-1">
            <h3 class="font-bold text-sm tracking-wide">@${post.profiles?.username || 'user'}</h3>
            <p class="text-xs text-gray-200 line-clamp-2">${post.caption || ''}</p>
            <p class="text-[11px] text-gray-300 flex items-center gap-1 font-medium">
              <span>🎵</span> ${post.audios?.title || 'Original Sound'} - ${post.audios?.artist || 'Unknown'}
            </p>
          </div>
        </div>
      `).join('');
    }

    fetchFeed();
  </script>
</body>
</html>
