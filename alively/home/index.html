<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>alive.ly</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* TOP HEADER */
    .top-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 16px 0;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }
    .top-header span {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }
    .top-header span.active {
      color: #fff;
      border-bottom: 2px solid #fff;
      padding-bottom: 2px;
    }

    /* FEED CONTAINER */
    .feed-container {
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar { display: none; }

    /* VIDEO CARD */
    .video-card {
      position: relative;
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ACTIONS SIDEBAR */
    .actions-sidebar {
      position: absolute;
      right: 12px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 5;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    .action-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: transform 0.1s ease;
    }
    .action-btn:active .action-icon { transform: scale(1.2); }
    .action-btn.liked .action-icon { color: #fe2c55; }
    .action-label {
      font-size: 12px;
      margin-top: 4px;
      font-weight: 600;
    }

    /* VIDEO OVERLAY INFO */
    .video-info {
      position: absolute;
      bottom: 80px;
      left: 16px;
      right: 80px;
      z-index: 5;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .username {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .caption { font-size: 14px; margin-bottom: 8px; line-height: 1.3; }
    .audio-track { font-size: 13px; color: #ddd; }

    /* BOTTOM NAVBAR */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
      border-top: 1px solid #121212;
    }
    .nav-item {
      color: #888;
      text-decoration: none;
      font-size: 20px;
      cursor: pointer;
    }
    .nav-item.active { color: #fff; }
    .upload-btn {
      background: #00d2ff;
      color: #000;
      width: 45px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      text-decoration: none;
    }

    /* MODAL SLIDE-UP PANELS */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      z-index: 20;
      display: none;
    }
    .modal-drawer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 65vh;
      background: #1e1e1e;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      display: flex;
      flex-direction: column;
      z-index: 25;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    .modal-drawer.active { transform: translateY(0); }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #333;
      font-size: 14px;
      font-weight: bold;
    }
    .close-btn { background: none; border: none; color: #aaa; font-size: 18px; cursor: pointer; }

    /* COMMENTS UI */
    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .comment-item { font-size: 13px; line-height: 1.4; }
    .comment-author { font-weight: bold; color: #aaa; margin-right: 6px; }
    .comment-input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #333;
      gap: 8px;
    }
    .comment-input-area input {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 20px;
      padding: 8px 14px;
      color: #fff;
      outline: none;
    }
    .comment-input-area button {
      background: #fe2c55;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* PROFILE UI */
    .profile-content { padding: 20px; text-align: center; }
    .profile-avatar { width: 70px; height: 70px; border-radius: 50%; background: #444; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .profile-stats { display: flex; justify-content: center; gap: 24px; margin: 16px 0; }
    .stat-box { display: flex; flex-direction: column; }
    .stat-val { font-weight: bold; font-size: 16px; }
    .stat-lbl { font-size: 12px; color: #888; }

    .status-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <div class="top-header">
    <span class="active">For You</span>
    <span>Following</span>
  </div>

  <!-- FEED -->
  <div class="feed-container" id="feed">
    <div class="status-msg" id="statusMsg">Loading feed...</div>
  </div>

  <!-- BOTTOM NAVBAR -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="closeModals()">🏠</div>
    <div class="nav-item">🔍</div>
    <a href="/alively/upload" class="upload-btn">+</a>
    <div class="nav-item">⚡</div>
    <div class="nav-item" onclick="openProfile('testuser')">👤</div>
  </nav>

  <!-- MODAL OVERLAY -->
  <div class="modal-overlay" id="overlay" onclick="closeModals()"></div>

  <!-- COMMENTS DRAWER -->
  <div class="modal-drawer" id="commentsDrawer">
    <div class="drawer-header">
      <span>Comments</span>
      <button class="close-btn" onclick="closeModals()">✕</button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <form class="comment-input-area" id="commentForm">
      <input type="text" id="commentInput" placeholder="Add a comment..." required>
      <button type="submit">Post</button>
    </form>
  </div>

  <!-- PROFILE DRAWER -->
  <div class="modal-drawer" id="profileDrawer">
    <div class="drawer-header">
      <span id="profileTitle">Profile</span>
      <button class="close-btn" onclick="closeModals()">✕</button>
    </div>
    <div class="profile-content">
      <div class="profile-avatar">👤</div>
      <h3 id="profileUsername">@testuser</h3>
      <div class="profile-stats">
        <div class="stat-box"><span class="stat-val">0</span><span class="stat-lbl">Following</span></div>
        <div class="stat-box"><span class="stat-val">12</span><span class="stat-lbl">Followers</span></div>
        <div class="stat-box"><span class="stat-val" id="profileLikes">0</span><span class="stat-lbl">Likes</span></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kdezxjizwqfmugkwpycb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkZXp4aml6d3FmbXVna3dweWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzQ5OTgsImV4cCI6MjEwMjc1MDk5OH0.Pc2p7s3umB-7PyPtTupQcA5occ5xEZdQzs4K5Nwhv_8';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const feed = document.getElementById('feed');
    const statusMsg = document.getElementById('statusMsg');
    const overlay = document.getElementById('overlay');
    const commentsDrawer = document.getElementById('commentsDrawer');
    const profileDrawer = document.getElementById('profileDrawer');
    const commentsList = document.getElementById('commentsList');
    const commentForm = document.getElementById('commentForm');
    
    let activeVideoId = null;
    let localComments = {};

    async function loadVideos() {
      try {
        const { data: videos, error } = await _supabase
          .from('videos')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;
        if (!videos || videos.length === 0) {
          statusMsg.innerText = 'No videos uploaded yet.';
          return;
        }

        statusMsg.remove();

        videos.forEach((vid) => {
          const card = document.createElement('div');
          card.className = 'video-card';
          const posterAttr = vid.cover_url ? `poster="${vid.cover_url}"` : '';

          card.innerHTML = `
            <video src="${vid.video_url}" ${posterAttr} loop playsinline webkit-playsinline></video>

            <div class="actions-sidebar">
              <button class="action-btn" onclick="toggleLike(this)">
                <div class="action-icon">💛</div>
                <span class="action-label count">0</span>
              </button>
              <button class="action-btn" onclick="openComments(${vid.id})">
                <div class="action-icon">💬</div>
                <span class="action-label" id="comment-count-${vid.id}">0</span>
              </button>
              <button class="action-btn" onclick="shareVideo('${vid.video_url}')">
                <div class="action-icon">↗️</div>
              </button>
            </div>

            <div class="video-info">
              <div class="username" onclick="openProfile('testuser')">@testuser</div>
              <div class="caption">${escapeHtml(vid.caption || '')}</div>
              <div class="audio-track">🎵 - ${escapeHtml(vid.audio_title || 'Original Sound')}</div>
            </div>
          `;

          feed.appendChild(card);
        });

        setupAutoplayObserver();
      } catch (err) {
        statusMsg.innerText = 'Error loading feed: ' + err.message;
      }
    }

    // TOGGLE LIKE BUTTON
    function toggleLike(btn) {
      const isLiked = btn.classList.toggle('liked');
      const countSpan = btn.querySelector('.count');
      let count = parseInt(countSpan.innerText, 10);

      if (isLiked) {
        btn.querySelector('.action-icon').innerText = '❤️';
        countSpan.innerText = count + 1;
      } else {
        btn.querySelector('.action-icon').innerText = '💛';
        countSpan.innerText = Math.max(0, count - 1);
      }
    }

    // COMMENTS SYSTEM
    function openComments(videoId) {
      activeVideoId = videoId;
      overlay.style.display = 'block';
      commentsDrawer.classList.add('active');
      renderComments();
    }

    function renderComments() {
      commentsList.innerHTML = '';
      const comments = localComments[activeVideoId] || [];

      if (comments.length === 0) {
        commentsList.innerHTML = '<div style="color:#666; text-align:center;">No comments yet. Be the first!</div>';
        return;
      }

      comments.forEach(c => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `<span class="comment-author">@${c.user}:</span>${escapeHtml(c.text)}`;
        commentsList.appendChild(item);
      });
    }

    commentForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text || !activeVideoId) return;

      if (!localComments[activeVideoId]) localComments[activeVideoId] = [];
      localComments[activeVideoId].push({ user: 'you', text });

      input.value = '';
      renderComments();

      // Update badge count
      const countLabel = document.getElementById(`comment-count-${activeVideoId}`);
      if (countLabel) countLabel.innerText = localComments[activeVideoId].length;
    });

    // PROFILE SYSTEM
    function openProfile(username) {
      document.getElementById('profileTitle').innerText = `@${username}`;
      document.getElementById('profileUsername').innerText = `@${username}`;
      overlay.style.display = 'block';
      profileDrawer.classList.add('active');
    }

    // CLOSE ALL MODALS
    function closeModals() {
      overlay.style.display = 'none';
      commentsDrawer.classList.remove('active');
      profileDrawer.classList.remove('active');
    }

    // SHARE LINK
    function shareVideo(url) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
        alert('Video link copied to clipboard!');
      }
    }

    // AUTOPLAY OBSERVER
    function setupAutoplayObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (!video) return;
          if (entry.isIntersecting) {
            video.play().catch(() => {});
          } else {
            video.pause();
            video.currentTime = 0;
          }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.video-card').forEach(card => observer.observe(card));
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    loadVideos();
  </script>
</body>
</html>
