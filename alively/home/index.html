<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>alive.ly</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* TOP HEADER */
    .top-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 16px 0;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }
    .top-header span {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }
    .top-header span.active {
      color: #fff;
      border-bottom: 2px solid #fff;
      padding-bottom: 2px;
    }

    /* FEED CONTAINER */
    .feed-container {
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar {
      display: none;
    }

    /* VIDEO CARD */
    .video-card {
      position: relative;
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* RIGHT SIDE ACTIONS */
    .actions-sidebar {
      position: absolute;
      right: 12px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 5;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    .action-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .action-label {
      font-size: 12px;
      margin-top: 4px;
      font-weight: 600;
    }

    /* BOTTOM OVERLAY INFO */
    .video-info {
      position: absolute;
      bottom: 80px;
      left: 16px;
      right: 80px;
      z-index: 5;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .username {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .caption {
      font-size: 14px;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .audio-track {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ddd;
    }

    /* BOTTOM NAVBAR */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
      border-top: 1px solid #121212;
    }
    .nav-item {
      color: #888;
      text-decoration: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-item.active {
      color: #fff;
    }
    .upload-btn {
      background: #00d2ff;
      color: #000;
      width: 45px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      text-decoration: none;
    }

    /* LOADING & EMPTY STATES */
    .status-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER NAVIGATION -->
  <div class="top-header">
    <span class="active">For You</span>
    <span>Following</span>
  </div>

  <!-- FEED -->
  <div class="feed-container" id="feed">
    <div class="status-msg" id="statusMsg">Loading feed...</div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav">
    <a href="/alively" class="nav-item active">🏠</a>
    <a href="#" class="nav-item">🔍</a>
    <a href="/alively/upload" class="upload-btn">+</a>
    <a href="#" class="nav-item">⚡</a>
    <a href="#" class="nav-item">👤</a>
  </nav>

  <script>
    const SUPABASE_URL = 'https://kdezxjizwqfmugkwpycb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkZXp4aml6d3FmbXVna3dweWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzQ5OTgsImV4cCI6MjEwMjc1MDk5OH0.Pc2p7s3umB-7PyPtTupQcA5occ5xEZdQzs4K5Nwhv_8';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const feed = document.getElementById('feed');
    const statusMsg = document.getElementById('statusMsg');

    async function loadVideos() {
      try {
        const { data: videos, error } = await _supabase
          .from('videos')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        if (!videos || videos.length === 0) {
          statusMsg.innerText = 'No videos found.';
          return;
        }

        statusMsg.remove();

        videos.forEach((vid, idx) => {
          const card = document.createElement('div');
          card.className = 'video-card';

          const posterAttr = vid.cover_url ? `poster="${vid.cover_url}"` : '';

          card.innerHTML = `
            <video 
              src="${vid.video_url}" 
              ${posterAttr}
              loop 
              playsinline 
              webkit-playsinline>
            </video>

            <div class="actions-sidebar">
              <button class="action-btn">
                <div class="action-icon">💛</div>
                <span class="action-label">1</span>
              </button>
              <button class="action-btn">
                <div class="action-icon">💬</div>
                <span class="action-label">0</span>
              </button>
              <button class="action-btn">
                <div class="action-icon">↗️</div>
              </button>
            </div>

            <div class="video-info">
              <div class="username">@testuser</div>
              <div class="caption">${escapeHtml(vid.caption || '')}</div>
              <div class="audio-track">🎵 - ${escapeHtml(vid.audio_title || 'Original Sound')}</div>
            </div>
          `;

          feed.appendChild(card);
        });

        setupAutoplayObserver();

      } catch (err) {
        statusMsg.innerText = 'Error loading feed: ' + err.message;
      }
    }

    // Auto-play / pause video when scrolled into view
    function setupAutoplayObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (!video) return;

          if (entry.isIntersecting) {
            video.play().catch(() => {});
          } else {
            video.pause();
            video.currentTime = 0;
          }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.video-card').forEach(card => {
        observer.observe(card);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    loadVideos();
  </script>
</body>
</html>
