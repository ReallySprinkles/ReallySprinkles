<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Video & Cover</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .upload-card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #aaa;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #fe2c55;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="upload-card">
  <h2>Upload Video</h2>
  <form id="uploadForm">
    <div class="form-group">
      <label>Video File (MP4/MOV)*</label>
      <input type="file" id="videoFile" accept="video/*" required>
    </div>

    <div class="form-group">
      <label>Cover Image (JPG/PNG)</label>
      <input type="file" id="coverFile" accept="image/*">
    </div>

    <div class="form-group">
      <label>Caption</label>
      <input type="text" id="caption" placeholder="Check out this video!">
    </div>

    <div class="form-group">
      <label>Audio Title</label>
      <input type="text" id="audioTitle" placeholder="Original Sound">
    </div>

    <button type="submit" id="submitBtn">Upload</button>
  </form>
  <div id="status"></div>
</div>

<script>
  const SUPABASE_URL = 'https://kdezxjizwqfmugkwpycb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkZXp4aml6d3FmbXVna3dweWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzQ5OTgsImV4cCI6MjEwMjc1MDk5OH0.Pc2p7s3umB-7PyPtTupQcA5occ5xEZdQzs4K5Nwhv_8';

  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const uploadForm = document.getElementById('uploadForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusDiv = document.getElementById('status');

  uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const videoInput = document.getElementById('videoFile').files[0];
    const coverInput = document.getElementById('coverFile').files[0];
    const caption = document.getElementById('caption').value;
    const audioTitle = document.getElementById('audioTitle').value || 'Original Sound';

    if (!videoInput) return;

    submitBtn.disabled = true;
    statusDiv.style.color = '#fff';
    statusDiv.innerText = 'Uploading files...';

    try {
      // 1. Upload Video File
      const videoExt = videoInput.name.split('.').pop();
      const videoFileName = `${Date.now()}_video.${videoExt}`;
      const { error: videoErr } = await _supabase.storage
        .from('videos')
        .upload(videoFileName, videoInput);

      if (videoErr) throw videoErr;

      const videoUrl = _supabase.storage.from('videos').getPublicUrl(videoFileName).data.publicUrl;

      // 2. Upload Cover File (if provided)
      let coverUrl = null;
      if (coverInput) {
        const coverExt = coverInput.name.split('.').pop();
        const coverFileName = `${Date.now()}_cover.${coverExt}`;
        const { error: coverErr } = await _supabase.storage
          .from('covers')
          .upload(coverFileName, coverInput);

        if (coverErr) throw coverErr;

        coverUrl = _supabase.storage.from('covers').getPublicUrl(coverFileName).data.publicUrl;
      }

      // 3. Save Record into Supabase "videos" Table
      const { error: dbErr } = await _supabase.from('videos').insert([
        {
          video_url: videoUrl,
          cover_url: coverUrl,
          caption: caption,
          audio_title: audioTitle
        }
      ]);

      if (dbErr) throw dbErr;

      statusDiv.style.color = '#4caf50';
      statusDiv.innerText = 'Upload successful!';
      uploadForm.reset();
    } catch (err) {
      statusDiv.style.color = '#f44336';
      statusDiv.innerText = `Error: ${err.message}`;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
