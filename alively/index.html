<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>musical.ly revival</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
    
    /* Navigation Bar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
      z-index: 100;
    }
    
    .btn {
      background: #ff0050;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Feed Container */
    #feed {
      height: 100vh;
      overflow-y: mandatory;
      scroll-snap-type: y mandatory;
    }
    
    .video-card {
      position: relative;
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }
    
    video { width: 100%; height: 100%; object-fit: cover; }
    
    .overlay {
      position: absolute;
      bottom: 30px;
      left: 15px;
      right: 80px;
      z-index: 10;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #222;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-content input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="navbar">
    <h2 style="font-size: 1.2rem;">musical.ly</h2>
    <div id="auth-buttons">
      <button class="btn" onclick="openModal('auth-modal')">Login / Sign Up</button>
    </div>
  </div>

  <!-- Video Feed -->
  <div id="feed"></div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal">
    <div class="modal-content">
      <h3>Account Access</h3>
      <input type="email" id="auth-email" placeholder="Email">
      <input type="password" id="auth-password" placeholder="Password">
      <input type="text" id="auth-username" placeholder="Username (Sign Up Only)">
      <button class="btn" onclick="handleSignUp()">Sign Up</button>
      <button class="btn" style="background:#444;" onclick="handleLogin()">Log In</button>
      <button class="btn" style="background:transparent; border:1px solid #666;" onclick="closeModal('auth-modal')">Cancel</button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="upload-modal" class="modal">
    <div class="modal-content">
      <h3>Upload Musical.ly Video</h3>
      <input type="file" id="video-file" accept="video/mp4,video/mov">
      <input type="text" id="video-caption" placeholder="Caption (e.g., #musically)">
      <input type="text" id="video-audio" placeholder="Audio Title">
      <button class="btn" onclick="handleUpload()">Publish Video</button>
      <button class="btn" style="background:transparent; border:1px solid #666;" onclick="closeModal('upload-modal')">Cancel</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kdezxjizwqfmugkwpycb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkZXp4aml6d3FmbXVna3dweWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzQ5OTgsImV4cCI6MjEwMjc1MDk5OH0.Pc2p7s3umB-7PyPtTupQcA5occ5xEZdQzs4K5Nwhv_8';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // Check user state on load
    async function initAuth() {
      const { data: { user } } = await supabase.auth.getUser();
      currentUser = user;
      updateAuthUI();
    }

    function updateAuthUI() {
      const container = document.getElementById('auth-buttons');
      if (currentUser) {
        container.innerHTML = `
          <button class="btn" onclick="openModal('upload-modal')">+ Upload</button>
          <button class="btn" style="background:#333; margin-left: 8px;" onclick="handleLogout()">Logout</button>
        `;
      } else {
        container.innerHTML = `<button class="btn" onclick="openModal('auth-modal')">Login / Sign Up</button>`;
      }
    }

    // Modal Control Helpers
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Authentication Handlers
    async function handleSignUp() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value;

      const { data, error } = await supabase.auth.signUp({
        email, password, options: { data: { username } }
      });

      if (error) alert(error.message);
      else { alert('Account created!'); closeModal('auth-modal'); initAuth(); }
    }

    async function handleLogin() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else { closeModal('auth-modal'); currentUser = data.user; updateAuthUI(); }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      currentUser = null;
      updateAuthUI();
    }

    // Video Upload Handler
    async function handleUpload() {
      if (!currentUser) return alert('Must be logged in to upload!');

      const fileInput = document.getElementById('video-file');
      const caption = document.getElementById('video-caption').value;
      const audioTitle = document.getElementById('video-audio').value || 'Original Sound';

      if (!fileInput.files.length) return alert('Please choose a video file');
      const file = fileInput.files[0];

      const filePath = `${currentUser.id}/${Date.now()}_${file.name}`;

      // 1. Upload file to Storage Bucket
      const { error: storageError } = await supabase.storage.from('videos').upload(filePath, file);
      if (storageError) return alert('Storage upload failed: ' + storageError.message);

      // 2. Get Media URL
      const { data: urlData } = supabase.storage.from('videos').getPublicUrl(filePath);

      // 3. Save Record in Videos Table
      const { error: dbError } = await supabase.from('videos').insert([{
        user_id: currentUser.id,
        video_url: urlData.publicUrl,
        caption: caption,
        audio_title: audioTitle
      }]);

      if (dbError) alert('DB insert failed: ' + dbError.message);
      else {
        alert('Video uploaded live!');
        closeModal('upload-modal');
        renderFeed();
      }
    }

    // Feed Renderer
    async function renderFeed() {
      const container = document.getElementById('feed');
      container.innerHTML = '';

      const { data: videos } = await supabase
        .from('videos')
        .select(`id, video_url, caption, audio_title, profiles ( username )`)
        .order('created_at', { ascending: false });

      if (!videos || videos.length === 0) {
        container.innerHTML = '<div style="padding-top: 100px; text-align: center;">No videos yet. Log in and upload the first one!</div>';
        return;
      }

      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <video src="${v.video_url}" loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
          <div class="overlay">
            <div style="font-weight:bold; margin-bottom: 4px;">${v.profiles ? '@' + v.profiles.username : '@user'}</div>
            <div style="margin-bottom: 6px;">${v.caption || ''}</div>
            <div style="font-size:0.85rem; opacity:0.8;">♫ ${v.audio_title || 'Original Sound'}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    initAuth();
    renderFeed();
  </script>
</body>
</html>
