<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alive.ly</title>
  <!-- Fixed: Correct Supabase JS Library Import -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

    /* Mandatory Auth Landing Screen */
    #auth-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.85)), url('https://picsum.photos/1080/1920') center/cover no-repeat;
      z-index: 500;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    .brand-title {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(45deg, #ff0050, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .brand-tagline {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 30px;
    }

    .auth-box {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(45deg, #ff0050, #00f2fe);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Main App View */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
      z-index: 100;
    }

    #feed {
      height: 100vh;
      overflow-y: mandatory;
      scroll-snap-type: y mandatory;
    }

    .video-card {
      position: relative;
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    video { width: 100%; height: 100%; object-fit: cover; }

    .overlay {
      position: absolute;
      bottom: 30px; left: 15px; right: 80px;
      z-index: 10;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* Upload Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      z-index: 600;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #181818;
      padding: 25px;
      border-radius: 14px;
      width: 90%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body>

  <!-- Mandatory Auth Landing Screen -->
  <div id="auth-screen">
    <div class="brand-title">Alive.ly</div>
    <div class="brand-tagline">value every moment, live Alive.ly</div>

    <div class="auth-box">
      <input type="email" id="email" class="auth-input" placeholder="Email address">
      <input type="password" id="password" class="auth-input" placeholder="Password">
      <input type="text" id="username" class="auth-input" placeholder="Username (Sign Up only)">
      
      <button class="btn-primary" onclick="handleSignUp()">Sign Up</button>
      <button class="btn-secondary" onclick="handleLogin()">Log In</button>
    </div>
  </div>

  <!-- App Main View -->
  <div class="navbar">
    <div class="brand-title" style="font-size:1.3rem;">Alive.ly</div>
    <div>
      <button class="btn-primary" style="padding: 8px 16px; width: auto;" onclick="openModal('upload-modal')">+ Upload</button>
      <button class="btn-secondary" style="padding: 8px 14px; width: auto; font-size: 0.85rem;" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <!-- Video Feed -->
  <div id="feed"></div>

  <!-- Upload Modal -->
  <div id="upload-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 10px;">Post Video to Alive.ly</h3>
      <input type="file" id="video-file" class="auth-input" accept="video/mp4,video/mov">
      <input type="text" id="video-caption" class="auth-input" placeholder="Caption (e.g. #alively)">
      <input type="text" id="video-audio" class="auth-input" placeholder="Audio Title">
      <button class="btn-primary" id="upload-btn" onclick="handleUpload()">Publish</button>
      <button class="btn-secondary" onclick="closeModal('upload-modal')">Cancel</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kdezxjizwqfmugkwpycb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkZXp4aml6d3FmbXVna3dweWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzQ5OTgsImV4cCI6MjEwMjc1MDk5OH0.Pc2p7s3umB-7PyPtTupQcA5occ5xEZdQzs4K5Nwhv_8';
    
    // Explicit initialization using global window object
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    async function checkUserSession() {
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        currentUser = user;

        if (currentUser) {
          document.getElementById('auth-screen').style.display = 'none';
          renderFeed();
        } else {
          document.getElementById('auth-screen').style.display = 'flex';
        }
      } catch (err) {
        console.error("Session check error:", err);
      }
    }

    async function handleSignUp() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const username = document.getElementById('username').value.trim();

      if (!email || !password || !username) {
        return alert('Please fill in your email, password, and username!');
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email, 
        password, 
        options: { data: { username } }
      });

      if (error) {
        alert('Sign Up Error: ' + error.message);
      } else {
        alert('Account created! Logging you in...');
        checkUserSession();
      }
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        return alert('Please enter your email and password!');
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alert('Login Error: ' + error.message);
      } else {
        checkUserSession();
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      document.getElementById('auth-screen').style.display = 'flex';
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function handleUpload() {
      const fileInput = document.getElementById('video-file');
      const caption = document.getElementById('video-caption').value;
      const audioTitle = document.getElementById('video-audio').value || 'Original Sound';

      if (!fileInput.files.length) return alert('Please select a video file first!');
      const file = fileInput.files[0];

      const btn = document.getElementById('upload-btn');
      btn.innerText = 'Publishing...';
      btn.disabled = true;

      const filePath = `${currentUser.id}/${Date.now()}_${file.name}`;

      const { error: storageError } = await supabaseClient.storage.from('videos').upload(filePath, file);

      if (storageError) {
        alert('Storage Upload Error: ' + storageError.message);
        btn.innerText = 'Publish';
        btn.disabled = false;
        return;
      }

      const { data: urlData } = supabaseClient.storage.from('videos').getPublicUrl(filePath);

      const { error: dbError } = await supabaseClient.from('videos').insert([{
        user_id: currentUser.id,
        video_url: urlData.publicUrl,
        caption: caption,
        audio_title: audioTitle
      }]);

      btn.innerText = 'Publish';
      btn.disabled = false;

      if (dbError) {
        alert('Database Error: ' + dbError.message);
      } else {
        alert('Video published to Alive.ly!');
        closeModal('upload-modal');
        renderFeed();
      }
    }

    async function renderFeed() {
      const container = document.getElementById('feed');
      container.innerHTML = '';

      const { data: videos, error } = await supabaseClient
        .from('videos')
        .select(`id, video_url, caption, audio_title, profiles ( username )`)
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<div style="padding-top: 100px; text-align: center; color: #ff0050;">Error loading videos: ${error.message}</div>`;
        return;
      }

      if (!videos || videos.length === 0) {
        container.innerHTML = '<div style="padding-top: 100px; text-align: center;">No videos on Alive.ly yet. Tap + Upload to post the first one!</div>';
        return;
      }

      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <video src="${v.video_url}" loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
          <div class="overlay">
            <div style="font-weight:bold; margin-bottom: 4px;">${v.profiles ? '@' + v.profiles.username : '@user'}</div>
            <div style="margin-bottom: 6px;">${v.caption || ''}</div>
            <div style="font-size:0.85rem; opacity:0.8;">♫ ${v.audio_title || 'Original Sound'}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Initialize session check after DOM load
    window.addEventListener('DOMContentLoaded', checkUserSession);
  </script>
</body>
</html>
