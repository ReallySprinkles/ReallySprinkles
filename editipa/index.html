<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f1417">
  <title>EditIPA - Web IPA Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Fonts (same as the rest of the site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       Material 3 Expressive tokens (shared with the main page)
       ========================================================= */
    :root {
      /* Dark scheme is the base */
      --md-sys-color-background: #0f1417;
      --md-sys-color-on-background: #dee3e7;
      --md-sys-color-on-surface: #dee3e7;
      --md-sys-color-on-surface-variant: #c0c8cd;
      --md-sys-color-surface-container-lowest: #0a0f11;
      --md-sys-color-surface-container-low: #171c1f;
      --md-sys-color-surface-container-high: #262b2e;
      --md-sys-color-surface-container-highest: #313639;
      --md-sys-color-primary: #86d2eb;
      --md-sys-color-on-primary: #003547;
      --md-sys-color-primary-container: #004d65;
      --md-sys-color-on-primary-container: #c3e8ff;
      --md-sys-color-secondary-container: #354a53;
      --md-sys-color-on-secondary-container: #cfe6f2;
      --md-sys-color-tertiary: #cdbdff;
      --md-sys-color-tertiary-container: #4d3f77;
      --md-sys-color-on-tertiary-container: #e9ddff;
      --md-sys-color-outline: #8a9297;
      --md-sys-color-outline-variant: #40484c;

      --mono-font: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --body-font: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      --md-shape-medium: 12px;
      --md-shape-large: 16px;
      --md-shape-full: 9999px;

      --md-elevation-3: 0 2px 4px rgba(0,0,0,0.30), 0 6px 12px 4px rgba(0,0,0,0.18);

      --md-spring-fast-spatial: cubic-bezier(0.42, 1.67, 0.21, 0.90);
      --md-spring-default-spatial: cubic-bezier(0.38, 1.21, 0.22, 1.00);
      --md-spring-default-effects: cubic-bezier(0.34, 0.80, 0.34, 1.00);
      --md-easing-decelerate: cubic-bezier(0, 0, 0, 1);
    }

    [data-theme="light"] {
      --md-sys-color-background: #f6fafe;
      --md-sys-color-on-background: #171c1f;
      --md-sys-color-on-surface: #171c1f;
      --md-sys-color-on-surface-variant: #40484c;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #f0f4f8;
      --md-sys-color-surface-container-high: #e4e9ed;
      --md-sys-color-surface-container-highest: #dee3e7;
      --md-sys-color-primary: #006688;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #c3e8ff;
      --md-sys-color-on-primary-container: #001e2b;
      --md-sys-color-secondary-container: #d0e6f2;
      --md-sys-color-on-secondary-container: #081e27;
      --md-sys-color-tertiary: #66558e;
      --md-sys-color-tertiary-container: #e9ddff;
      --md-sys-color-on-tertiary-container: #211047;
      --md-sys-color-outline: #70787d;
      --md-sys-color-outline-variant: #c0c8cd;
      --md-elevation-3: 0 2px 4px rgba(0,0,0,0.20), 0 6px 12px 4px rgba(0,0,0,0.10);
    }

    @media (prefers-color-scheme: light) {
      [data-theme="system"] {
        --md-sys-color-background: #f6fafe;
        --md-sys-color-on-background: #171c1f;
        --md-sys-color-on-surface: #171c1f;
        --md-sys-color-on-surface-variant: #40484c;
        --md-sys-color-surface-container-lowest: #ffffff;
        --md-sys-color-surface-container-low: #f0f4f8;
        --md-sys-color-surface-container-high: #e4e9ed;
        --md-sys-color-surface-container-highest: #dee3e7;
        --md-sys-color-primary: #006688;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-primary-container: #c3e8ff;
        --md-sys-color-on-primary-container: #001e2b;
        --md-sys-color-secondary-container: #d0e6f2;
        --md-sys-color-on-secondary-container: #081e27;
        --md-sys-color-tertiary: #66558e;
        --md-sys-color-tertiary-container: #e9ddff;
        --md-sys-color-on-tertiary-container: #211047;
        --md-sys-color-outline: #70787d;
        --md-sys-color-outline-variant: #c0c8cd;
        --md-elevation-3: 0 2px 4px rgba(0,0,0,0.20), 0 6px 12px 4px rgba(0,0,0,0.10);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      font-family: var(--body-font);
      margin: 0;
      padding: 24px 20px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s var(--md-spring-default-effects), color 0.3s var(--md-spring-default-effects);
    }

    /* =========================================================
       State layers + ripple
       ========================================================= */
    .state-layer {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .state-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: currentColor;
      opacity: 0;
      border-radius: inherit;
      pointer-events: none;
      transition: opacity 0.2s var(--md-spring-default-effects);
      z-index: -1;
    }

    .state-layer:hover::after { opacity: 0.08; }
    .state-layer:focus-visible::after { opacity: 0.10; }
    .state-layer:active::after { opacity: 0.12; }

    .state-layer:focus-visible {
      outline: 3px solid var(--md-sys-color-primary);
      outline-offset: 3px;
    }

    .ripple-wave {
      position: absolute;
      border-radius: 50%;
      background-color: currentColor;
      opacity: 0.16;
      transform: scale(0);
      pointer-events: none;
      animation: ripple-expand 0.6s var(--md-easing-decelerate) forwards;
      z-index: -1;
    }

    @keyframes ripple-expand {
      to { transform: scale(1); opacity: 0; }
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* =========================================================
       Header
       ========================================================= */
    .header {
      text-align: center;
      margin-bottom: 28px;
      max-width: 480px;
      margin-top: 24px;
    }

    .header h1 {
      font-size: 3.6rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 0 0 14px;
      color: var(--md-sys-color-on-surface);
    }

    .header p {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 1rem;
      line-height: 1.5;
      margin: 0;
    }

    /* Filled pill button that squares off on press */
    .upload-btn {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      height: 56px;
      padding: 0 36px;
      font-family: var(--mono-font);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: var(--md-shape-full);
      cursor: pointer;
      margin-top: 20px;
      transition: border-radius 0.45s var(--md-spring-fast-spatial), transform 0.45s var(--md-spring-fast-spatial);
    }

    .upload-btn:hover {
      border-radius: 28px 28px 28px 14px;
    }

    .upload-btn:active {
      border-radius: var(--md-shape-large);
      transform: scale(0.96);
    }

    #file-input, #icon-input { display: none; }

    /* =========================================================
       Editor card
       ========================================================= */
    .editor-card {
      display: none;
      background-color: var(--md-sys-color-surface-container-high);
      border-radius: 48px 48px 20px 48px;
      padding: 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: none;
      animation: pop-in 0.6s var(--md-spring-default-spatial) both;
    }

    .editor-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    /* Icon tile: tonal surface that morphs on hover */
    .icon-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto 24px;
      padding: 18px 28px 14px;
      width: fit-content;
      cursor: pointer;
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      border-radius: 36px;
      transition: border-radius 0.5s var(--md-spring-default-spatial), transform 0.5s var(--md-spring-default-spatial);
    }

    .icon-container:hover {
      border-radius: 48px 48px 48px 20px;
    }

    .icon-container:active {
      border-radius: 20px;
      transform: scale(0.96);
    }

    .app-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: var(--md-sys-color-surface-container-highest);
      object-fit: cover;
      box-shadow: var(--md-elevation-3);
      border: 3px solid var(--md-sys-color-primary);
      transition: border-radius 0.6s var(--md-spring-default-spatial), transform 0.6s var(--md-spring-default-spatial);
    }

    .icon-container:hover .app-icon {
      border-radius: 32px;
      transform: rotate(-3deg) scale(1.04);
    }

    .icon-hint {
      font-family: var(--mono-font);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-top: 10px;
      opacity: 0.85;
    }

    /* Filled text fields */
    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 0.85rem;
      font-weight: 500;
      margin: 0 0 6px 8px;
    }

    .form-group input[type="text"] {
      width: 100%;
      height: 52px;
      background-color: var(--md-sys-color-surface-container-lowest);
      border: 2px solid transparent;
      border-radius: 26px;
      padding: 0 22px;
      color: var(--md-sys-color-on-surface);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s var(--md-spring-default-effects), border-radius 0.45s var(--md-spring-fast-spatial);
    }

    .form-group input[type="text"]:focus {
      border-color: var(--md-sys-color-primary);
      border-radius: 18px;
    }

    .download-btn {
      width: 100%;
      height: 56px;
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      border-radius: var(--md-shape-full);
      font-family: var(--mono-font);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      margin-top: 16px;
      transition: border-radius 0.45s var(--md-spring-fast-spatial), transform 0.45s var(--md-spring-fast-spatial);
    }

    .download-btn:hover {
      border-radius: 28px 28px 28px 14px;
    }

    .download-btn:active {
      border-radius: var(--md-shape-large);
      transform: scale(0.97);
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 3rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>EditIPA</h1>
    <p>A simple tool to edit IPAs directly in browser.<br>Edit name, version, identifier, icon, or any other key.<br>Just upload your IPA and start editing.</p>
    <button class="upload-btn state-layer" onclick="document.getElementById('file-input').click()">Upload IPA</button>
    <input type="file" id="file-input" accept=".ipa" onchange="handleFileSelect(event)" />
  </div>

  <div class="editor-card" id="editor">
    <div class="editor-title">Editor</div>

    <div class="icon-container state-layer" onclick="document.getElementById('icon-input').click()">
      <img id="icon-preview" class="app-icon" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><rect width='80' height='80' fill='%23333'/></svg>" alt="App Icon"/>
      <span class="icon-hint">Click icon to replace</span>
      <input type="file" id="icon-input" accept="image/png" onchange="handleIconChange(event)" />
    </div>

    <div class="form-group">
      <label>Display Name (CFBundleDisplayName)</label>
      <input type="text" id="CFBundleDisplayName" />
    </div>

    <div class="form-group">
      <label>Bundle Identifier (CFBundleIdentifier)</label>
      <input type="text" id="CFBundleIdentifier" />
    </div>

    <div class="form-group">
      <label>Bundle Name (CFBundleName)</label>
      <input type="text" id="CFBundleName" />
    </div>

    <div class="form-group">
      <label>Bundle Version (CFBundleVersion)</label>
      <input type="text" id="CFBundleVersion" />
    </div>

    <div class="form-group">
      <label>Short Version String (CFBundleShortVersionString)</label>
      <input type="text" id="CFBundleShortVersionString" />
    </div>

    <div class="form-group">
      <label>Minimum iOS Version (MinimumOSVersion)</label>
      <input type="text" id="MinimumOSVersion" />
    </div>

    <button class="download-btn state-layer" onclick="exportIPA()">Export Edited IPA</button>
  </div>

  <script>
    let zipInstance = null;
    let plistPath = "";
    let appFolderPath = "";
    let parsedPlist = {};
    let originalFileName = "edited_app.ipa";
    let foundIconPaths = [];
    let newIconBlob = null;

    // --- FULL BINARY PLIST PARSER ENGINE ---
    function parsePlistBuffer(buffer) {
      const header = String.fromCharCode.apply(null, new Uint8Array(buffer.slice(0, 8)));
      if (header.startsWith("bplist")) {
        return parseBinaryPlistBuffer(buffer);
      } else {
        const textDecoder = new TextDecoder("utf-8");
        const xmlText = textDecoder.decode(buffer);
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const rootDict = xmlDoc.querySelector("plist > dict");
        return rootDict ? parseXmlNode(rootDict) : {};
      }
    }

    function parseBinaryPlistBuffer(buffer) {
      const view = new DataView(buffer);
      const trailerOffset = buffer.byteLength - 32;
      const offsetIntSize = view.getUint8(trailerOffset + 6);
      const objectRefSize = view.getUint8(trailerOffset + 7);
      const numObjects = Number(view.getBigUint64(trailerOffset + 8));
      const topObject = Number(view.getBigUint64(trailerOffset + 16));
      const offsetTableOffset = Number(view.getBigUint64(trailerOffset + 24));

      const offsets = [];
      for (let i = 0; i < numObjects; i++) {
        let off = 0;
        const pos = offsetTableOffset + i * offsetIntSize;
        for (let j = 0; j < offsetIntSize; j++) off = (off << 8) | view.getUint8(pos + j);
        offsets.push(off);
      }

      function readObject(objRef) {
        if (objRef >= offsets.length) return null;
        const off = offsets[objRef];
        const byte = view.getUint8(off);
        const type = (byte & 0xF0) >> 4;
        let count = byte & 0x0F;
        let ptr = off + 1;

        if (count === 0x0F) {
          const countByte = view.getUint8(ptr);
          const countLen = 1 << (countByte & 0x0F);
          ptr++;
          count = 0;
          for (let i = 0; i < countLen; i++) count = (count << 8) | view.getUint8(ptr + i);
          ptr += countLen;
        }

        switch (type) {
          case 0: // Simple types
            return count === 8 ? false : count === 9 ? true : null;
          case 1: { // Integer
            const len = 1 << count;
            let val = 0;
            for (let i = 0; i < len; i++) val = (val * 256) + view.getUint8(ptr + i);
            return val;
          }
          case 2: { // Real (Float)
            return count === 2 ? view.getFloat32(ptr) : view.getFloat64(ptr);
          }
          case 5: { // ASCII String
            let str = "";
            for (let i = 0; i < count; i++) str += String.fromCharCode(view.getUint8(ptr + i));
            return str;
          }
          case 6: { // UTF-16 String
            let str = "";
            for (let i = 0; i < count; i++) str += String.fromCharCode(view.getUint16(ptr + i * 2));
            return str;
          }
          case 10: case 12: { // Array / Set
            const arr = [];
            for (let i = 0; i < count; i++) {
              let ref = 0;
              for (let j = 0; j < objectRefSize; j++) ref = (ref << 8) | view.getUint8(ptr + i * objectRefSize + j);
              arr.push(readObject(ref));
            }
            return arr;
          }
          case 13: { // Dictionary
            const dict = {};
            const keyRefs = [];
            const valRefs = [];
            for (let i = 0; i < count; i++) {
              let ref = 0;
              for (let j = 0; j < objectRefSize; j++) ref = (ref << 8) | view.getUint8(ptr + i * objectRefSize + j);
              keyRefs.push(ref);
            }
            const valPtr = ptr + count * objectRefSize;
            for (let i = 0; i < count; i++) {
              let ref = 0;
              for (let j = 0; j < objectRefSize; j++) ref = (ref << 8) | view.getUint8(valPtr + i * objectRefSize + j);
              valRefs.push(ref);
            }
            for (let i = 0; i < count; i++) dict[readObject(keyRefs[i])] = readObject(valRefs[i]);
            return dict;
          }
          default:
            return null;
        }
      }

      return readObject(topObject);
    }

    function parseXmlNode(node) {
      const tag = node.tagName.toLowerCase();
      if (tag === 'dict') {
        const obj = {};
        const children = Array.from(node.children);
        for (let i = 0; i < children.length; i += 2) {
          const keyNode = children[i];
          const valNode = children[i + 1];
          if (keyNode && valNode && keyNode.tagName.toLowerCase() === 'key') {
            obj[keyNode.textContent.trim()] = parseXmlNode(valNode);
          }
        }
        return obj;
      } else if (tag === 'array') {
        return Array.from(node.children).map(parseXmlNode);
      } else if (tag === 'true') {
        return true;
      } else if (tag === 'false') {
        return false;
      } else if (tag === 'integer' || tag === 'real') {
        return Number(node.textContent.trim());
      } else {
        return node.textContent.trim();
      }
    }

    // --- XML EXPORT GENERATOR ---
    function valueToXml(val, indent = '  ') {
      if (val === undefined || val === null) return '';
      if (typeof val === 'boolean') return `${indent}<${val}/>\n`;
      if (typeof val === 'number') {
        return Number.isInteger(val) ? `${indent}<integer>${val}</integer>\n` : `${indent}<real>${val}</real>\n`;
      }
      if (Array.isArray(val)) {
        let res = `${indent}<array>\n`;
        for (const item of val) res += valueToXml(item, indent + '  ');
        res += `${indent}</array>\n`;
        return res;
      }
      if (typeof val === 'object') {
        let res = `${indent}<dict>\n`;
        for (const [k, v] of Object.entries(val)) {
          res += `${indent}  <key>${k}</key>\n`;
          res += valueToXml(v, indent + '  ');
        }
        res += `${indent}</dict>\n`;
        return res;
      }
      const safeStr = String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return `${indent}<string>${safeStr}</string>\n`;
    }

    function objectToXmlPlist(obj) {
      let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
      xml += '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n';
      xml += '<plist version="1.0">\n<dict>\n';

      for (const [key, val] of Object.entries(obj)) {
        xml += `  <key>${key}</key>\n`;
        xml += valueToXml(val, '  ');
      }
      xml += '</dict>\n</plist>';
      return xml;
    }

    // --- MAIN LOGIC ---
    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      originalFileName = file.name.replace(/\.ipa$/i, '') + '_edited.ipa';
      zipInstance = new JSZip();

      try {
        const zipData = await zipInstance.loadAsync(file);

        // Locate Payload/*.app/Info.plist
        plistPath = Object.keys(zipData.files).find(path => 
          path.match(/^Payload\/[^\/]+\.app\/Info\.plist$/i)
        );

        if (!plistPath) {
          alert("Invalid IPA: Info.plist not found inside Payload folder.");
          return;
        }

        appFolderPath = plistPath.substring(0, plistPath.lastIndexOf('/') + 1);

        const buffer = await zipData.files[plistPath].async("arraybuffer");
        parsedPlist = parsePlistBuffer(buffer) || {};

        // Populate fields
        document.getElementById('CFBundleDisplayName').value = parsedPlist.CFBundleDisplayName || parsedPlist.CFBundleName || '';
        document.getElementById('CFBundleIdentifier').value = parsedPlist.CFBundleIdentifier || '';
        document.getElementById('CFBundleName').value = parsedPlist.CFBundleName || '';
        document.getElementById('CFBundleVersion').value = parsedPlist.CFBundleVersion || '';
        document.getElementById('CFBundleShortVersionString').value = parsedPlist.CFBundleShortVersionString || '';
        document.getElementById('MinimumOSVersion').value = parsedPlist.MinimumOSVersion || '';

        await extractAndDisplayIcon(zipData);

        // Display Editor Form
        document.getElementById('editor').style.display = 'block';

      } catch (err) {
        console.error(err);
        alert("Failed to process IPA file: " + err.message);
      }
    }

    async function extractAndDisplayIcon(zipData) {
      foundIconPaths = Object.keys(zipData.files).filter(path => 
        path.startsWith(appFolderPath) && path.match(/(AppIcon|icon).*\.png$/i)
      );

      if (foundIconPaths.length > 0) {
        const iconPath = foundIconPaths[foundIconPaths.length - 1];
        try {
          const iconBlob = await zipData.files[iconPath].async("blob");
          const url = URL.createObjectURL(iconBlob);
          
          // Test if image loads properly (standard PNG vs CgBI iOS PNG)
          const img = new Image();
          img.onload = () => {
            document.getElementById('icon-preview').src = url;
          };
          img.onerror = () => {
            console.warn("Icon file format is optimized CgBI PNG; cannot preview natively in browser.");
          };
          img.src = url;
        } catch (e) {
          console.warn("Failed reading icon blob", e);
        }
      }
    }

    function handleIconChange(event) {
      const file = event.target.files[0];
      if (!file) return;

      newIconBlob = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('icon-preview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function exportIPA() {
      if (!zipInstance || !plistPath) return;

      // Update keys in parsed dictionary
      parsedPlist.CFBundleDisplayName = document.getElementById('CFBundleDisplayName').value;
      parsedPlist.CFBundleIdentifier = document.getElementById('CFBundleIdentifier').value;
      parsedPlist.CFBundleName = document.getElementById('CFBundleName').value;
      parsedPlist.CFBundleVersion = document.getElementById('CFBundleVersion').value;
      parsedPlist.CFBundleShortVersionString = document.getElementById('CFBundleShortVersionString').value;
      parsedPlist.MinimumOSVersion = document.getElementById('MinimumOSVersion').value;

      if (newIconBlob) {
        const iconArrayBuffer = await newIconBlob.arrayBuffer();

        const defaultIconNames = [
          "AppIcon60x60", "AppIcon76x76", "AppIcon20x20", 
          "AppIcon29x29", "AppIcon40x40", "AppIcon"
        ];

        if (!parsedPlist.CFBundleIcons) {
          parsedPlist.CFBundleIcons = {
            CFBundlePrimaryIcon: {
              CFBundleIconFiles: defaultIconNames,
              CFBundleIconName: "AppIcon"
            }
          };
        }

        if (!parsedPlist['CFBundleIcons~ipad']) {
          parsedPlist['CFBundleIcons~ipad'] = {
            CFBundlePrimaryIcon: {
              CFBundleIconFiles: defaultIconNames,
              CFBundleIconName: "AppIcon"
            }
          };
        }

        if (!parsedPlist.CFBundleIconFiles) {
          parsedPlist.CFBundleIconFiles = defaultIconNames;
        }

        // Replace all previously identified PNG files
        foundIconPaths.forEach(path => zipInstance.file(path, iconArrayBuffer));

        // Inject standardized standard-resolution icon names
        const iconFileVariants = [
          "AppIcon60x60@2x.png", "AppIcon60x60@3x.png",
          "AppIcon76x76@2x.png", "AppIcon20x20@2x.png",
          "AppIcon29x29@2x.png", "AppIcon40x40@2x.png",
          "AppIcon.png", "Icon.png", "Icon@2x.png"
        ];

        iconFileVariants.forEach(name => {
          zipInstance.file(appFolderPath + name, iconArrayBuffer);
        });
      }

      // Convert updated plist structure back into valid XML representation
      const updatedPlistXml = objectToXmlPlist(parsedPlist);
      zipInstance.file(plistPath, updatedPlistXml);

      // Package and trigger download
      const blob = await zipInstance.generateAsync({ type: "blob" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = originalFileName;
      link.click();
    }

    // Match the theme chosen on the main page (falls back to system)
    function applySavedTheme() {
      let theme = 'system';
      try { theme = localStorage.getItem('theme') || 'system'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        requestAnimationFrame(() => {
          meta.setAttribute('content', getComputedStyle(document.body).backgroundColor);
        });
      }
    }

    // Ripple effect (delegated)
    document.addEventListener('pointerdown', (e) => {
      const host = e.target.closest('.state-layer');
      if (!host) return;
      const rect = host.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2;
      const wave = document.createElement('span');
      wave.className = 'ripple-wave';
      wave.style.width = wave.style.height = size + 'px';
      wave.style.left = (e.clientX - rect.left - size / 2) + 'px';
      wave.style.top = (e.clientY - rect.top - size / 2) + 'px';
      host.appendChild(wave);
      wave.addEventListener('animationend', () => wave.remove());
    });

    applySavedTheme();
  </script>
</body>
</html>
