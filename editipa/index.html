<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EditIPA - Web IPA Editor</title>
  <!-- JSZip is the only required CDN library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #121212;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-color: #ffffff;
      --border-color: #333333;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 480px;
    }

    .header h1 { font-size: 2rem; margin-bottom: 8px; }
    .header p { color: var(--text-sub); font-size: 0.95rem; line-height: 1.4; }

    .upload-btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 12px;
    }

    #file-input { display: none; }

    .editor-card {
      display: none;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    .editor-title { text-align: center; font-size: 1.5rem; margin-bottom: 16px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; color: var(--text-sub); font-size: 0.85rem; margin-bottom: 6px; }
    .form-group input[type="text"] {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    .download-btn {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>EditIPA</h1>
    <p>A simple tool to edit IPAs directly in browser.<br>Edit name, version, identifier, etc., or any other key.<br>Just upload your IPA and start editing.</p>
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">Upload IPA</button>
    <input type="file" id="file-input" accept=".ipa" onchange="handleFileSelect(event)" />
  </div>

  <div class="editor-card" id="editor">
    <div class="editor-title">Editor</div>

    <div class="form-group">
      <label>Display Name (CFBundleDisplayName)</label>
      <input type="text" id="CFBundleDisplayName" />
    </div>

    <div class="form-group">
      <label>Bundle Identifier (CFBundleIdentifier)</label>
      <input type="text" id="CFBundleIdentifier" />
    </div>

    <div class="form-group">
      <label>Bundle Name (CFBundleName)</label>
      <input type="text" id="CFBundleName" />
    </div>

    <div class="form-group">
      <label>Bundle Version (CFBundleVersion)</label>
      <input type="text" id="CFBundleVersion" />
    </div>

    <div class="form-group">
      <label>Short Version String (CFBundleShortVersionString)</label>
      <input type="text" id="CFBundleShortVersionString" />
    </div>

    <div class="form-group">
      <label>Minimum iOS Version (MinimumOSVersion)</label>
      <input type="text" id="MinimumOSVersion" />
    </div>

    <button class="download-btn" onclick="exportIPA()">Export Edited IPA</button>
  </div>

  <script>
    let zipInstance = null;
    let plistPath = "";
    let parsedPlist = {};
    let originalFileName = "edited_app.ipa";

    // Native pure JS binary plist decoder
    function parseBinaryPlist(buffer) {
      const view = new DataView(buffer);
      const trailerOffset = buffer.byteLength - 32;
      const offsetIntSize = view.getUint8(trailerOffset + 6);
      const objectRefSize = view.getUint8(trailerOffset + 7);
      const numObjects = Number(view.getBigUint64(trailerOffset + 8));
      const topObjectOffset = Number(view.getBigUint64(trailerOffset + 16));
      const offsetTableOffset = Number(view.getBigUint64(trailerOffset + 24));

      const offsets = [];
      for (let i = 0; i < numObjects; i++) {
        let off = 0;
        const pos = offsetTableOffset + i * offsetIntSize;
        for (let j = 0; j < offsetIntSize; j++) {
          off = (off << 8) | view.getUint8(pos + j);
        }
        offsets.push(off);
      }

      function readObject(objRef) {
        const off = offsets[objRef];
        const byte = view.getUint8(off);
        const type = (byte & 0xF0) >> 4;
        let count = byte & 0x0F;
        let ptr = off + 1;

        if (count === 0x0F) {
          const countByte = view.getUint8(ptr);
          const countType = (countByte & 0xF0) >> 4;
          const countLen = 1 << (countByte & 0x0F);
          ptr++;
          count = 0;
          for (let i = 0; i < countLen; i++) count = (count << 8) | view.getUint8(ptr + i);
          ptr += countLen;
        }

        switch (type) {
          case 0: // Simple (null, bool)
            return count === 8 ? false : count === 9 ? true : null;
          case 1: { // Integer
            const len = 1 << count;
            let val = 0;
            for (let i = 0; i < len; i++) val = (val << 8) | view.getUint8(ptr + i);
            return val;
          }
          case 5: { // ASCII String
            let str = "";
            for (let i = 0; i < count; i++) str += String.fromCharCode(view.getUint8(ptr + i));
            return str;
          }
          case 6: { // UTF-16 String
            let str = "";
            for (let i = 0; i < count; i++) {
              str += String.fromCharCode(view.getUint16(ptr + i * 2));
            }
            return str;
          }
          case 10: case 12: { // Array / Set
            const arr = [];
            for (let i = 0; i < count; i++) {
              let ref = 0;
              for (let j = 0; j < objectRefSize; j++) ref = (ref << 8) | view.getUint8(ptr + i * objectRefSize + j);
              arr.push(readObject(ref));
            }
            return arr;
          }
          case 13: { // Dictionary
            const dict = {};
            const keyRefs = [];
            const valRefs = [];
            for (let i = 0; i < count; i++) {
              let ref = 0;
              for (let j = 0; j < objectRefSize; j++) ref = (ref << 8) | view.getUint8(ptr + i * objectRefSize + j);
              keyRefs.push(ref);
            }
            const valPtr = ptr + count * objectRefSize;
            for (let i = 0; i < count; i++) {
              let ref = 0;
              for (let j = 0; j < objectRefSize; j++) ref = (ref << 8) | view.getUint8(valPtr + i * objectRefSize + j);
              valRefs.push(ref);
            }
            for (let i = 0; i < count; i++) {
              dict[readObject(keyRefs[i])] = readObject(valRefs[i]);
            }
            return dict;
          }
          default:
            return null;
        }
      }

      return readObject(0);
    }

    // Helper: Convert JS Object back to XML Plist string
    function objectToXmlPlist(obj) {
      let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
      xml += '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n';
      xml += '<plist version="1.0">\n<dict>\n';

      for (const [key, val] of Object.entries(obj)) {
        if (val === undefined || val === null) continue;
        xml += `  <key>${key}</key>\n`;
        if (typeof val === 'boolean') {
          xml += `  <${val}/>\n`;
        } else if (typeof val === 'number') {
          xml += Number.isInteger(val) ? `  <integer>${val}</integer>\n` : `  <real>${val}</real>\n`;
        } else {
          const safeStr = String(val)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          xml += `  <string>${safeStr}</string>\n`;
        }
      }

      xml += '</dict>\n</plist>';
      return xml;
    }

    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      originalFileName = file.name.replace('.ipa', '') + '_edited.ipa';
      zipInstance = new JSZip();

      try {
        const zipData = await zipInstance.loadAsync(file);

        // Find Payload/*.app/Info.plist
        plistPath = Object.keys(zipData.files).find(path => 
          path.match(/^Payload\/[^\/]+\.app\/Info\.plist$/i)
        );

        if (!plistPath) {
          alert("Invalid IPA: Info.plist not found inside Payload.");
          return;
        }

        const buffer = await zipData.files[plistPath].async("arraybuffer");
        const header = new Uint8Array(buffer.slice(0, 8));
        const isBinary = String.fromCharCode.apply(null, header).startsWith("bplist");

        if (isBinary) {
          parsedPlist = parseBinaryPlist(buffer) || {};
        } else {
          const textDecoder = new TextDecoder("utf-8");
          const xmlText = textDecoder.decode(buffer);
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, "text/xml");
          
          parsedPlist = {};
          const keys = xmlDoc.getElementsByTagName("key");
          for (let i = 0; i < keys.length; i++) {
            const keyName = keys[i].textContent;
            const nextElem = keys[i].nextElementSibling;
            if (nextElem) parsedPlist[keyName] = nextElem.textContent;
          }
        }

        // Fill form fields
        document.getElementById('CFBundleDisplayName').value = parsedPlist.CFBundleDisplayName || parsedPlist.CFBundleName || '';
        document.getElementById('CFBundleIdentifier').value = parsedPlist.CFBundleIdentifier || '';
        document.getElementById('CFBundleName').value = parsedPlist.CFBundleName || '';
        document.getElementById('CFBundleVersion').value = parsedPlist.CFBundleVersion || '';
        document.getElementById('CFBundleShortVersionString').value = parsedPlist.CFBundleShortVersionString || '';
        document.getElementById('MinimumOSVersion').value = parsedPlist.MinimumOSVersion || '';

        document.getElementById('editor').style.display = 'block';

      } catch (err) {
        console.error(err);
        alert("Failed to parse Info.plist: " + err.message);
      }
    }

    async function exportIPA() {
      if (!zipInstance || !plistPath) return;

      parsedPlist.CFBundleDisplayName = document.getElementById('CFBundleDisplayName').value;
      parsedPlist.CFBundleIdentifier = document.getElementById('CFBundleIdentifier').value;
      parsedPlist.CFBundleName = document.getElementById('CFBundleName').value;
      parsedPlist.CFBundleVersion = document.getElementById('CFBundleVersion').value;
      parsedPlist.CFBundleShortVersionString = document.getElementById('CFBundleShortVersionString').value;
      parsedPlist.MinimumOSVersion = document.getElementById('MinimumOSVersion').value;

      const updatedPlistXml = objectToXmlPlist(parsedPlist);
      zipInstance.file(plistPath, updatedPlistXml);

      const blob = await zipInstance.generateAsync({ type: "blob" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = originalFileName;
      link.click();
    }
  </script>
</body>
</html>
