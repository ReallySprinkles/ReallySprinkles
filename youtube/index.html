<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube (2017)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 2017 Header -->

      <a href="#" class="logo-container">

          </g>
          <g fill="#FF0000">
            <path d="M27.97 3.2c-6.1 0-19.12.33-21.78 1.05C2.62 5.2 1.2 7.7.5 11.28 0 15.65 0 24.8 0 24.8s0 9.15.5 13.52c.7 3.58 2.12 6.08 5.69 7.03 2.66.72 15.68 1.05 21.78 1.05 6.1 0 19.12-.33 21.78-1.05 3.57-.95 4.99-3.45 5.69-7.03.5-4.37.5-13.52.5-13.52s0-9.15-.5-13.52c-.7-3.58-2.12-6.08-5.69-7.03C47.09 3.53 34.07 3.2 27.97 3.2z"/>
          </g>
          <path fill="#FFF" d="M22.3 35.3V14.3l15.1 10.5z"/>
        </svg>
      </a>
    </div>

    <div class="masthead-center">
      <form class="search-form" id="searchForm">
        <input type="text" placeholder="Search" class="search-input" id="searchInput">
        <button type="submit" class="search-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="#737373">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      </form>
    </div>

    <div class="masthead-right">
      <button class="upload-btn" title="Upload">&#128249;</button>
      <button class="apps-btn" title="YouTube Apps">&#9783;</button>
      <button class="sign-in-btn">SIGN IN</button>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <nav class="guide-section">
        <a href="#" class="guide-item active">
          <span class="icon">&#127960;</span>
          <span class="label">Home</span>
        </a>
        <a href="#" class="guide-item">
          <span class="icon">&#128293;</span>
          <span class="label">Trending</span>
        </a>
        <a href="#" class="guide-item">
          <span class="icon">&#128240;</span>
          <span class="label">Subscriptions</span>
        </a>
      </nav>
      <hr>
      <nav class="guide-section">
        <div class="section-title">LIBRARY</div>
        <a href="#" class="guide-item">
          <span class="icon">&#128336;</span>
          <span class="label">History</span>
        </a>
        <a href="#" class="guide-item">
          <span class="icon">&#128337;</span>
          <span class="label">Watch Later</span>
        </a>
        <a href="#" class="guide-item">
          <span class="icon">&#128077;</span>
          <span class="label">Liked videos</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="shelf-header">
        <h2>Recommended</h2>
      </div>
      <div class="video-grid" id="videoGrid">
        <!-- Videos injected dynamically -->
      </div>
    </main>
  </div>

  <!-- 2017 Video Modal Watch Screen -->
  <div class="video-modal" id="videoModal">
    <div class="modal-content">
      <span class="close-modal" id="closeModal">&times;</span>
      <div class="player-container">
        <iframe id="modalPlayer" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
      <div class="modal-info">
        <h1 id="modalTitle"></h1>
        <div class="modal-meta">
          <span id="modalViews"></span>
          <div class="modal-actions">
            <button class="action-btn">&#128077; <span id="likeCount">12K</span></button>
            <button class="action-btn">&#128078;</button>
            <button class="action-btn">SHARE</button>
          </div>
        </div>
        <hr>
        <div class="channel-bar">
          <div class="channel-avatar" id="modalAvatar"></div>
          <div class="channel-details">
            <div class="channel-name" id="modalChannel"></div>
            <div class="sub-count">1.4M subscribers</div>
          </div>
          <button class="sub-button">SUBSCRIBE <span>1.4M</span></button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
