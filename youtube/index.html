<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube Android (2017)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Android App Top Bar -->
  <header class="app-bar">
    <div class="app-bar-left">
      <div class="yt-android-logo">
        <svg viewBox="0 0 200 60" width="85" height="19">
          <path fill="#FF0000" d="M27.97 3.2c-6.1 0-19.12.33-21.78 1.05C2.62 5.2 1.2 7.7.5 11.28 0 15.65 0 24.8 0 24.8s0 9.15.5 13.52c.7 3.58 2.12 6.08 5.69 7.03 2.66.72 15.68 1.05 21.78 1.05 6.1 0 19.12-.33 21.78-1.05 3.57-.95 4.99-3.45 5.69-7.03.5-4.37.5-13.52.5-13.52s0-9.15-.5-13.52c-.7-3.58-2.12-6.08-5.69-7.03C47.09 3.53 34.07 3.2 27.97 3.2z"/>
          <path fill="#FFF" d="M22.3 35.3V14.3l15.1 10.5z"/>
          <path fill="#FFF" d="M63 14.87v28.26h-6.36v-3.08c-1.8 2.37-4.13 3.56-7 3.56-2.5 0-4.4-.8-5.7-2.4-1.3-1.6-1.95-3.95-1.95-7.05V14.87h6.42v18.06c0 1.35.25 2.3.76 2.84.5.55 1.25.82 2.22.82 1.3 0 2.5-.5 3.6-1.5V14.87H63zM85.4 20.3v22.83h-6.32V40.2c-1.8 2.3-4.1 3.5-6.9 3.5-2.6 0-4.5-.8-5.7-2.4-1.2-1.6-1.8-3.9-1.8-7V20.3h6.4v17.2c0 1.4.2 2.3.7 2.8.5.5 1.2.8 2.1.8 1.4 0 2.7-.6 3.9-1.8V20.3h5.6z"/>
        </svg>
      </div>
    </div>
    <div class="app-bar-right">
      <button class="action-icon" id="searchToggleBtn">&#128065;</button>
      <button class="action-icon">&#8942;</button>
    </div>
  </header>

  <!-- Expandable Search Bar -->
  <div class="search-bar-container" id="searchBar">
    <input type="text" id="searchInput" placeholder="Search YouTube">
    <button id="searchSubmitBtn">Search</button>
  </div>

  <!-- Android Top Navigation Tabs (Material Design 2017) -->
  <nav class="android-tabs">
    <button class="tab-item active" data-query="trending">
      <span class="tab-label">HOME</span>
    </button>
    <button class="tab-item" data-query="trending music">
      <span class="tab-label">TRENDING</span>
    </button>
    <button class="tab-item" data-query="gaming 2017">
      <span class="tab-label">SUBSCRIPTIONS</span>
    </button>
    <button class="tab-item" data-query="official video">
      <span class="tab-label">LIBRARY</span>
    </button>
    <div class="tab-indicator" id="tabIndicator"></div>
  </nav>

  <!-- Feed List -->
  <main class="android-feed" id="androidFeed">
    <div class="status-msg">Loading feeds...</div>
  </main>

  <!-- Floating Action Button (FAB Upload - Iconic 2017 Android feature) -->
  <button class="fab-upload" title="Upload">&#128249;</button>

  <!-- Native-Style Video Activity Screen -->
  <div class="video-activity" id="videoActivity">
    <div class="activity-header">
      <button class="back-arrow" id="closeActivityBtn">&#8592;</button>
      <span class="activity-title">Playing Video</span>
    </div>
    <div class="native-player-box">
      <iframe id="androidPlayer" src="" frameborder="0" allowfullscreen></iframe>
    </div>
    <div class="activity-body">
      <h2 id="activityVideoTitle"></h2>
      <div class="video-submeta" id="activitySubMeta"></div>
      
      <!-- Like/Dislike Action Row -->
      <div class="android-action-row">
        <button class="row-btn">&#128077; <span>12K</span></button>
        <button class="row-btn">&#128078; <span>Dislike</span></button>
        <button class="row-btn">&#10150; <span>Share</span></button>
        <button class="row-btn">&#128190; <span>Download</span></button>
      </div>
      
      <hr class="divider">

      <!-- Channel Row -->
      <div class="channel-row">
        <div class="channel-avatar-circle" id="activityAvatar"></div>
        <div class="channel-info-block">
          <div class="channel-title" id="activityChannelTitle"></div>
          <div class="sub-count-text">1.2M subscribers</div>
        </div>
        <button class="sub-red-btn">SUBSCRIBE</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
